# What the standalone installers download to build their programs, each pinned by URL,
# SHA-256, and size. packaging/build.py rejects a download whose SHA-256 doesn't match.
# packaging/README.md says how to update one.
#
# The default voice isn't listed here: the build bundles the files src/dogear/voice/
# catalog.toml pins, the same ones Dogear downloads for itself.

# Platforms the installers are built for, named by system and machine. On macOS, the
# oldest version supported: onnxruntime's macOS wheels need 14, so the programs built
# here target it too, and the app says so.
[platforms]
linux-x86_64 = {}
macos-arm64 = { minimum_os = "14.0" }
windows-x86_64 = {}

# Source archives. build-programs.sh builds them on every platform, so the bundle holds
# exactly these programs and their licenses are known.

[sources.lame]
name = "LAME"
version = "3.100"
license = "LGPL-2.0-or-later"
homepage = "https://lame.sourceforge.io"
url = "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
# The same file, from Debian's archive, for when SourceForge's mirrors are down.
mirrors = ["https://deb.debian.org/debian/pool/main/l/lame/lame_3.100.orig.tar.gz"]
sha256 = "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"
size = 1524133
license_files = ["COPYING"]
bundled = "inside ffmpeg and ffprobe (MP3 encoding)"

[sources.ffmpeg]
name = "FFmpeg"
version = "8.1.3"
license = "LGPL-2.1-or-later"
homepage = "https://ffmpeg.org"
url = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
sha256 = "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
size = 11732036
license_files = ["LICENSE.md", "COPYING.LGPLv2.1"]
bundled = "ffmpeg and ffprobe"

[sources.espeak-ng]
name = "eSpeak NG"
version = "1.52.0"
license = "GPL-3.0-or-later"
homepage = "https://github.com/espeak-ng/espeak-ng"
url = "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz"
sha256 = "bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23"
size = 17739803
license_files = ["COPYING"]
bundled = "espeak-ng and espeak-ng-data, run as a separate program"

[sources.sonic]
name = "Sonic"
version = "fbf75c3d6d846bad3bb3d456cbc5d07d9fd8c104"
license = "Apache-2.0"
homepage = "https://github.com/waywardgeek/sonic"
# The commit eSpeak NG 1.52.0's build asks for. Handed to that build so it fetches
# nothing; eSpeak NG is built without it, so none of it is bundled.
url = "https://github.com/waywardgeek/sonic/archive/fbf75c3d6d846bad3bb3d456cbc5d07d9fd8c104.tar.gz"
sha256 = "715827b5a39b79e56e44397d7b845910df996d4cca74777b3b61629b1ddc98c1"
size = 5361159
license_files = []
bundled = ""
