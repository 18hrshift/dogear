name: Docker

# Builds the Docker image and makes a short book with it, with no network, so the voice
# inside the image is the one used. Nothing is pushed to a registry.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t dogear:ci .
      - name: Make a short book offline
        run: |
          mkdir -m 777 books
          cp tests/fixtures/*.epub books/book.epub
          docker run --rm --network none -v "$PWD/books:/data" dogear:ci \
            make /data/book.epub --sections 1-2 --format m4b,daisy -o /data/out
          ls books/out
          test -f "books/out/The Strange Case of Dr. Jekyll and Mr. Hyde.m4b"
          test -f "books/out/The Strange Case of Dr. Jekyll and Mr. Hyde DAISY/ncc.html"
      - name: Open the web page
        run: |
          docker run -d --name dogear -p 127.0.0.1:8765:8765 dogear:ci
          for _ in $(seq 30); do
            docker logs dogear 2>&1 | grep -q "Press Ctrl+C" && break
            sleep 1
          done
          link=$(docker logs dogear 2>&1 | grep -m1 -o 'http://127.0.0.1:8765/start?key=[a-z0-9-]*')
          test -n "$link"
          curl --fail --silent --cookie-jar jar --output /dev/null "$link"
          curl --fail --silent --cookie jar http://127.0.0.1:8765/ | grep -q "Make a talking book"
          docker stop dogear
          docker logs dogear 2>&1 | tail -n 1 | grep -qx "Stopped."
